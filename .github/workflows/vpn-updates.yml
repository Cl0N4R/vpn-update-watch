name: VPN Update Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6,18 * * *"

permissions:
  contents: write

concurrency:
  group: vpn-update-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check VPN app releases and notify Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import html
          import urllib.request
          import urllib.parse
          import urllib.error

          TELEGRAM_TOKEN = os.environ.get("TELEGRAM_TOKEN")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN")
          STATE_FILE = "state.json"

          if not TELEGRAM_TOKEN or not TELEGRAM_CHAT_ID:
              raise SystemExit("Missing TELEGRAM_TOKEN or TELEGRAM_CHAT_ID repository secrets.")

          PROJECTS = {
              "BPB VPN": "bia-pain-bache/BPB-VPN",
              "PattNG": "patterniha/PattNG",
              "Karing": "KaringX/karing",
              "MLM VPN": "mlmvpn/mlmvpn_android",
              "Exclave": "ExclaveNetwork/Exclave",
              "ArasClient": "ArasTey/ArasClient",
              "Shroudly": "umutxyp/Shroudly",
              "MahsaNG": "GFW-knocker/MahsaNG",
          }

          # Known installed version. Other apps will be baselined on the first run.
          INSTALLED_VERSIONS = {
              "umutxyp/Shroudly": "2.6.75",
          }

          def normalize_tag(value):
              return (value or "").strip().lower().removeprefix("v").removeprefix("release-")

          def load_state():
              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      return data if isinstance(data, dict) else {}
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}

          def save_state(state):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          def github_request(url):
              headers = {
                  "User-Agent": "VPN-Update-Watch",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if GITHUB_TOKEN:
                  headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def send_telegram(message):
              data = urllib.parse.urlencode({
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              url = f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage"
              req = urllib.request.Request(url, data=data)
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
                  if not result.get("ok"):
                      raise RuntimeError("Telegram API did not confirm message delivery.")

          def recommendation(release, changelog):
              text = (changelog or "").lower()
              if release.get("prerelease"):
                  return "فعلاً صبر کن؛ این نسخه Pre-release است."
              security = ["security", "vulnerability", "cve", "امنیت", "آسیب‌پذیری"]
              bugs = ["fix", "bug", "crash", "memory", "battery", "cpu",
                      "رفع", "کرش", "باتری", "حافظه"]
              features = ["feature", "support", "add", "improve",
                          "قابلیت", "پشتیبانی", "بهبود"]
              if any(word in text for word in security):
                  return "اولویت نصب؛ یادداشت انتشار به تغییر امنیتی اشاره می‌کند."
              if any(word in text for word in bugs):
                  return "ارزش نصب دارد؛ احتمالاً رفع باگ یا بهبود عملکرد است."
              if any(word in text for word in features):
                  return "اختیاری؛ اگر قابلیت جدید برایت مهم است نصب کن."
              return "ضرورت فوری ندارد؛ در صورت تمایل نصب کن."

          state = load_state()
          changed = False
          errors = []
          baseline_lines = []
          updates = []

          for app_name, repository in PROJECTS.items():
              try:
                  url = f"https://api.github.com/repos/{repository}/releases?per_page=10"
                  releases = github_request(url)
                  if not isinstance(releases, list):
                      raise RuntimeError("Unexpected GitHub releases response.")

                  published = [r for r in releases if not r.get("draft")]
                  if not published:
                      continue

                  latest = published[0]
                  tag = latest.get("tag_name") or ""
                  if not tag:
                      raise RuntimeError("Latest release has no tag_name.")

                  previous = state.get(repository)
                  if previous is None:
                      previous = INSTALLED_VERSIONS.get(repository)
                      if previous is None:
                          state[repository] = tag
                          changed = True
                          baseline_lines.append(f"• {html.escape(app_name)}: {html.escape(tag)} (نسخه مبنا ثبت شد)")
                          continue

                  if normalize_tag(tag) == normalize_tag(previous):
                      if repository not in state:
                          state[repository] = tag
                          changed = True
                      continue

                  changelog = latest.get("body") or "توضیح انتشار موجود نیست."
                  # Escape untrusted release notes before embedding in Telegram HTML.
                  safe_changelog = html.escape(changelog[:2200])
                  release_url = html.escape(latest.get("html_url") or "", quote=True)
                  release_type = "Pre-release" if latest.get("prerelease") else "Stable"
                  date = (latest.get("published_at") or "")[:10] or "نامشخص"

                  message = (
                      f"<b>{html.escape(app_name)} — آپدیت جدید</b>\n\n"
                      f"نسخه قبلی ثبت‌شده: <code>{html.escape(str(previous))}</code>\n"
                      f"نسخه جدید: <code>{html.escape(tag)}</code>\n"
                      f"نوع انتشار: {release_type}\n"
                      f"تاریخ انتشار: {html.escape(date)}\n\n"
                      f"<b>تغییرات:</b>\n{safe_changelog}\n\n"
                      f"<b>پیشنهاد:</b>\n{recommendation(latest, changelog)}\n\n"
                      f'<a href="{release_url}">مشاهده Release در GitHub</a>'
                  )
                  updates.append((repository, tag, message))

              except Exception as error:
                  errors.append(f"• {app_name}: {str(error)[:350]}")

          # Send each release separately to avoid Telegram's message-size limit.
          for repository, tag, message in updates:
              send_telegram(message)
              state[repository] = tag
              changed = True

          if baseline_lines:
              send_telegram(
                  "<b>پایش VPN راه‌اندازی شد</b>\n"
                  "برای برنامه‌هایی که نسخه نصب‌شده‌شان مشخص نبود، آخرین Release به‌عنوان نسخه مبنا ثبت شد؛ "
                  "بنابراین آپدیت قدیمی به‌اشتباه اعلان نمی‌شود.\n\n"
                  + "\n".join(baseline_lines)
              )

          if errors:
              send_telegram("<b>خطا در بررسی بعضی پروژه‌ها</b>\n" + "\n".join(errors))

          if changed:
              save_state(state)
          elif not updates and not errors:
              print("No new releases. No Telegram message sent.")
          PY

      - name: Save release history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update VPN release history"
            git push
          fi
