name: Daily VPN release watch

on:
  schedule:
    - cron: "15 5 * * *" # 08:45 Asia/Tehran
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan official GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_releases.py
      - name: Commit report and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          if ! git diff --cached --quiet; then
            git commit -m "Update daily release watch report"
            git push
          fi
